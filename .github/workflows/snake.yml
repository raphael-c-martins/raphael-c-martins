name: Gerar Gráficos de Contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Gerar Pac-Man e Cobrinha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gerar Pac-Man (tema claro e escuro)
        uses: abozanona/pacman-contribution-graph@v5
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: opportunistic

      - name: Gerar Cobrinha (tema claro e escuro)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
